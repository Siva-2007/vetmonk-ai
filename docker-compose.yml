version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vetmonk-backend
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-default}
      - JWT_SECRET=${JWT_SECRET:-VetMonkDevelopmentSecretKeyMustBeOverriddenInProductionAtLeast64CharsLong}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - DB_URL=${DB_URL:-jdbc:h2:file:./data/vetmonkdb;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE}
      - DB_USERNAME=${DB_USERNAME:-sa}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-true}
    volumes:
      - vetmonk-data:/app/data
      - vetmonk-uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vetmonk-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  vetmonk-data:
  vetmonk-uploads:
